<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo contemporáneo de objetos para el hogar, tecnología y bienestar.">
  <title>Tiendita OSCAR — Catálogo Productos Básicos y más</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Ir al inicio" id="brand">NOVA.</a>
    <div class="topbar-meta"><span class="pulse"></span><span id="productCount">Catálogo</span></div>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="headline">
      <p class="eyebrow" id="eyebrow">Selección contemporánea</p>
      <h1 id="headline">Objetos que hacen mejor lo cotidiano.</h1>
      <p class="intro-copy" id="description">Una colección breve de diseño, tecnología y bienestar.</p>
    </section>

    <section class="catalog" aria-label="Catálogo de productos">
      <div class="catalog-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar por nombre o categoría" aria-label="Buscar productos">
          <kbd>/</kbd>
        </label>
        <p class="results" id="resultsCount" aria-live="polite"></p>
      </div>

      <div class="grid" id="productGrid"></div>
      <div class="empty" id="emptyState" hidden>
        <p>No encontramos coincidencias.</p>
        <button id="clearSearch" type="button">Limpiar búsqueda</button>
      </div>
      <div class="loader" id="loader" aria-label="Cargando más productos"><span></span><span></span><span></span></div>
      <div id="scrollSentinel" aria-hidden="true"></div>
    </section>
  </main>

  <footer><span id="footerBrand">NOVA.</span><span>Diseño para todos los días · <span id="year"></span></span></footer>

  <a class="whatsapp" id="whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="Contactar al proveedor por WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a12 12 0 0 0-10.3 18.2L4 28l7-1.6A12 12 0 1 0 16 3Z"></path><path d="M12 10.5c.3-.6.5-.6.9-.6h.6c.2 0 .4.1.5.4l1.1 2.5c.1.3.1.5-.1.8l-.8 1c-.2.2-.2.4 0 .7.8 1.5 2 2.7 3.6 3.5.3.2.5.1.7-.1l1-1.2c.2-.3.5-.3.8-.2l2.4 1.2c.3.2.4.3.4.5 0 .6-.3 1.8-1.2 2.5-.8.7-1.8 1-3 .7-1.2-.2-3.2-1-5.5-3-2.7-2.4-4.3-5.3-4.5-6.7-.2-1.2.3-2.6 1.1-3.3.5-.5 1.1-.7 2-.7Z"></path></svg>
    <span>WhatsApp</span>
  </a>
  <script src="app.js" defer></script>
</body>
</html>
